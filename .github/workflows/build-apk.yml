name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup platforms
        run: |
          set -o pipefail
          if ! ./tool/setup_platforms.sh 2>&1 | tee x.log; then
            grep -n -i -E 'error|failed|exception|because|version solving' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=setup::$(cat err.txt)"
            exit 1
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee x.log; then
            grep -n -i -E 'error' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=analyze::$(cat err.txt)"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee x.log; then
            grep -n -i -E 'error|failed|exception|Expected|Actual|Which|\.dart [0-9]+:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee x.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|\.dart:[0-9]+' x.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=build::$(cat err.txt)"
            exit 1
          fi

      # Firma: se il repository ha i secret SIGNING_KEYSTORE_B64 e
      # SIGNING_PASSWORD usa quella chiave privata; altrimenti resta la chiave
      # di debug di Flutter, conservata in cache tra una build e l'altra.
      - name: Sign APKs
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            for f in build/app/outputs/flutter-apk/*-release.apk; do
              "${BT}apksigner" sign --ks "$RUNNER_TEMP/app.jks" --ks-key-alias app \
                --ks-pass env:KS_PW --key-pass env:KS_PW "$f"
            done
            rm -f "$RUNNER_TEMP/app.jks"
          else
            echo "Nessun secret di firma: uso la chiave di debug in cache."
          fi
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "${BT}apksigner" verify --print-certs "$f" | head -3
          done
          ls -la build/app/outputs/flutter-apk/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Watch Lab build ${{ github.run_number }}
          body: |
            Scarica **app-arm64-v8a-release.apk** (telefoni recenti).
            Telefoni vecchi: app-armeabi-v7a-release.apk.
          files: build/app/outputs/flutter-apk/*-release.apk
